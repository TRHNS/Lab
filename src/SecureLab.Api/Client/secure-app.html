<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>ЛР 03 — сценарій користувача</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 720px;
            margin: 24px auto;
            padding: 0 16px;
        }

        fieldset {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin: 6px 0;
        }

        input, select, textarea {
            width: 100%;
            box-sizing: border-box;
        }

        .status {
            font-weight: bold;
        }

        .error {
            color: #b00020;
        }
    </style>
</head>
<body>
    <h1>SecureLab — сценарій користувача</h1>
    <p>Стан сеансу: <span id="session-state" class="status">перевіряється…</span></p>

    <fieldset>
        <legend>Реєстрація</legend>
        <form id="register-form">
            <label>Ім’я користувача <input name="userName" autocomplete="username" required minlength="3" maxlength="64"></label>
            <label>Email <input name="email" type="email" autocomplete="email" required maxlength="256"></label>
            <label>Відображуване ім’я <input name="displayName" required maxlength="120"></label>
            <label>Пароль <input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128"></label>
            <button type="submit">Зареєструватися</button>
        </form>
        <p id="register-result"></p>
    </fieldset>

    <fieldset>
        <legend>Вхід</legend>
        <form id="login-form">
            <label>Ім’я користувача <input name="userName" autocomplete="username" required></label>
            <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
            <button type="submit">Увійти</button>
        </form>
        <p id="login-result"></p>
    </fieldset>

    <fieldset>
        <legend>Мій профіль</legend>
        <dl id="profile"></dl>
        <p id="profile-result"></p>
        <button id="logout-button" type="button">Вийти</button>
    </fieldset>

    <fieldset>
        <legend>Новий інцидент</legend>
        <form id="incident-form">
            <label>Заголовок <input name="title" required maxlength="160"></label>
            <label>Опис <textarea name="description" required maxlength="4000" rows="4"></textarea></label>
            <label>
                Severity
                <select name="severity" required>
                    <option>Low</option>
                    <option>Medium</option>
                    <option>High</option>
                    <option>Critical</option>
                </select>
            </label>
            <label>Час виникнення <input name="occurredAt" type="datetime-local" required></label>
            <button type="submit">Створити</button>
        </form>
        <p id="incident-result"></p>
    </fieldset>

    <script type="module" src="secure-app.js"></script>
</body>
</html>
